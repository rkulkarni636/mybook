<title>Europe Rail Carrier Map</title>
<style>
  /* One full-width map; click a country for a small pop-up of links */
  :root {
    color-scheme: light;
    --surface: #fcfcfb;
    --panel: #ffffff;
    --ink: #0b0b0b;
    --border: #e2e0da;
    --sea: #dbe9f2;
    --west: #2a78d6; --west-hi: #4b93ea;
    --south: #eb6834; --south-hi: #f5875a;
    --north: #1baf7a; --north-hi: #37c894;
    --link: #1f66bd;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface: #17171a; --panel: #222226; --ink: #ffffff; --border: #3a3935; --sea: #16324a;
      --west: #3987e5; --west-hi: #5a9ff0; --south: #d95926; --south-hi: #ea7646;
      --north: #199e70; --north-hi: #2fbb8a; --link: #7db4f5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #17171a; --panel: #222226; --ink: #ffffff; --border: #3a3935; --sea: #16324a;
    --west: #3987e5; --west-hi: #5a9ff0; --south: #d95926; --south-hi: #ea7646;
    --north: #199e70; --north-hi: #2fbb8a; --link: #7db4f5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 40px; }
  .map-wrap { position: relative; }
  svg.map { display: block; width: 100%; height: auto; background: var(--sea);
    border: 1px solid var(--border); border-radius: 12px; }
  path.country { stroke: var(--surface); stroke-width: 0.7px; cursor: pointer;
    transition: transform 160ms ease; }
  path.r-w { fill: var(--west); } path.r-s { fill: var(--south); } path.r-n { fill: var(--north); }
  path.country:hover, path.country:focus-visible, path.country.active {
    transform: scale(1.045); stroke: var(--ink); stroke-width: 1.6px; outline: none; }
  path.r-w:hover, path.r-w:focus-visible, path.r-w.active { fill: var(--west-hi); }
  path.r-s:hover, path.r-s:focus-visible, path.r-s.active { fill: var(--south-hi); }
  path.r-n:hover, path.r-n:focus-visible, path.r-n.active { fill: var(--north-hi); }
  .labels text { pointer-events: none; font-weight: 600; fill: #fff; stroke: rgba(0,0,0,.45);
    stroke-width: 2.5px; paint-order: stroke; text-anchor: middle; dominant-baseline: middle; }
  .pop { position: absolute; z-index: 5; min-width: 200px; max-width: calc(100% - 12px);
    background: var(--panel); color: var(--ink); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.22); padding: 10px 12px 6px; font-size: 13px;
    transform: translate(-50%, calc(-100% - 12px)); }
  .pop.below { transform: translate(-50%, 12px); }
  .pop-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 4px; }
  .pop-title { font-weight: 700; font-size: 14px; }
  .pop-close { border: 0; background: none; color: var(--ink); font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 4px; }
  .pop ul { list-style: none; margin: 0; padding: 0; }
  .pop li + li { border-top: 1px solid var(--border); }
  .pop a { display: block; padding: 7px 2px; color: var(--link); font-weight: 500; text-decoration: none; }
  .pop a:hover, .pop a:focus-visible { text-decoration: underline; outline: none; }
  @media (prefers-reduced-motion: reduce) { path.country { transition: none; } }
</style>

  var pop = document.getElementById('pop');
  var popTitle = document.getElementById('pop-title');
  var popList = document.getElementById('pop-list');
  var active = null;

  // Bring a hovered country to the front so its enlarged outline is not hidden by neighbours
  group.addEventListener('mouseover', function (e) {
    var el = e.target;
    if (el.tagName === 'path' && el !== group.lastElementChild) group.appendChild(el);
  });

  function open(el, x, y) {
    var name = el.getAttribute('data-name');
    if (active) active.classList.remove('active');
    active = el; el.classList.add('active');
    popTitle.textContent = name;
    popList.innerHTML = '';
    (LINKS[name] || []).forEach(function (c) {
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = c.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.textContent = c.name;
      li.appendChild(a); popList.appendChild(li);
    });
    pop.hidden = false;
    var w = pop.offsetWidth, h = pop.offsetHeight, ww = wrap.clientWidth;
    pop.style.left = Math.min(Math.max(x, w / 2 + 6), ww - w / 2 - 6) + 'px';
    pop.style.top = y + 'px';
    pop.classList.toggle('below', y - h - 12 < 0);
  }
  function close() {
    pop.hidden = true;
    if (active) { active.classList.remove('active'); active = null; }
  }

  group.addEventListener('click', function (e) {
    var el = e.target;
    if (el.tagName !== 'path') return;
    e.stopPropagation();
    var r = wrap.getBoundingClientRect();
    open(el, e.clientX - r.left, e.clientY - r.top);
  });
  group.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.tagName === 'path') {
      e.preventDefault();
      var r = wrap.getBoundingClientRect(), b = e.target.getBoundingClientRect();
      open(e.target, b.left + b.width / 2 - r.left, b.top + b.height / 2 - r.top);
      var first = popList.querySelector('a'); if (first) first.focus();
    }
  });
  document.getElementById('pop-close').addEventListener('click', close);
  document.addEventListener('click', function (e) { if (!pop.contains(e.target)) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
})();
